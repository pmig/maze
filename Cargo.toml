[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/mazemail"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/pmig/mazemail"
publish = false

[workspace.dependencies]
# Internal crates (layering: see AGENTS.md)
mazemail_types = { path = "crates/mazemail_types" }
vault = { path = "crates/vault" }

# External crates, pinned here and inherited with `workspace = true`
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
blake3 = { version = "1", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
getrandom = "0.4"
hkdf = "0.13"
keyring-core = "1"
security-framework = { version = "3", features = ["OSX_10_15"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1", features = ["derive"] }

# Test-only
aead-stream = { version = "0.6", features = ["alloc"] }
insta = { version = "1", features = ["json", "yaml"] }
pretty_assertions = "1"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = true
