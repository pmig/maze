[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/mazemail"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/pmig/mazemail"
publish = false

[workspace.dependencies]
# Internal crates (layering: see AGENTS.md)
mazemail_types = { path = "crates/mazemail_types" }
auto_update = { path = "crates/auto_update" }
mail_ui = { path = "crates/mail_ui" }
mazemail_mime = { path = "crates/mazemail_mime" }
release_channel = { path = "crates/release_channel" }
settings = { path = "crates/settings" }
ui = { path = "crates/ui" }
vault = { path = "crates/vault" }
imap = { path = "crates/imap" }

# External crates, pinned here and inherited with `workspace = true`
ammonia = "4.2.4"
anyhow = "1"
# GPUI comes from Zed's `gpui-pre-*` snapshots. gpui-kit pins the exact snapshot it was
# built against (PLAN ADR-002); keep these pins equal to the ones in gpui-kit's manifest.
async-channel = "2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio", "compress"] }
async-trait = "0.1"
base64 = "0.23"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-kit = "0.8"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
bitflags = { version = "2", features = ["serde"] }
blake3 = { version = "1", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
jsonc-parser = { version = "0.34", features = ["serde"] }
keyring-core = "1"
libc = "0.2"
notify = "8"
notify-debouncer-mini = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
ruzstd = "0.9"
schemars = "1"
security-framework = { version = "3", features = ["OSX_10_15"] }
semver = { version = "1", features = ["serde"] }
html5ever = "0.40.1"
linkify = "0.11.0"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
whatlang = "0.18.0"
webpki-roots = "1"

# Test-only
aead-stream = { version = "0.6", features = ["alloc"] }
image = { version = "0.25", default-features = false, features = ["png"] }
insta = { version = "1", features = ["json", "yaml"] }
pretty_assertions = "1"
proptest = "1"
rcgen = "0.14"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# GPUI and its hot dependencies run at full speed even in debug builds, as gpui-kit
# does: unoptimized layout, text shaping and rasterization make every frame slow.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
ropey = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = true
