[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/mazemail"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/pmig/maze"
publish = false

[workspace.dependencies]
# Internal crates (layering: see AGENTS.md)
agent = { path = "crates/agent" }
agent_ui = { path = "crates/agent_ui" }
auth = { path = "crates/auth" }
auto_update_ui = { path = "crates/auto_update_ui" }
composer = { path = "crates/composer" }
html_view = { path = "crates/html_view" }
import = { path = "crates/import" }
ingest = { path = "crates/ingest" }
local_api = { path = "crates/local_api" }
mazemail_core = { path = "crates/mazemail_core" }
mazemail_types = { path = "crates/mazemail_types" }
auto_update = { path = "crates/auto_update" }
mail_ui = { path = "crates/mail_ui" }
mazemail_mime = { path = "crates/mazemail_mime" }
release_channel = { path = "crates/release_channel" }
sandbox = { path = "crates/sandbox" }
search = { path = "crates/search" }
security = { path = "crates/security" }
settings = { path = "crates/settings" }
smtp = { path = "crates/smtp" }
store = { path = "crates/store" }
sync = { path = "crates/sync" }
ui = { path = "crates/ui" }
vault = { path = "crates/vault" }
imap = { path = "crates/imap" }

# External crates, pinned here and inherited with `workspace = true`
# The ACP client SDK (Apache-2.0, ADR-006); the reference clone is 3.3.0.
agent-client-protocol = "3.5"
ammonia = "4.2.4"
anyhow = "1"
# GPUI comes from Zed's `gpui-pre-*` snapshots. gpui-kit pins the exact snapshot it was
# built against (PLAN ADR-002); keep these pins equal to the ones in gpui-kit's manifest.
async-channel = "2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio", "compress"] }
async-trait = "0.1"
aws-lc-rs = "1.18"
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-kit = "0.8"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
bitflags = { version = "2", features = ["serde"] }
blake3 = { version = "1", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
dpi = "0.1"
euclid = "0.22"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
http = "1"
idna = "1.1"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
keyring-core = "1"
libc = "0.2"
# SMTP submission (PLAN §4.5): async transport over Tokio with rustls (ring, like the
# IMAP client) and the platform certificate verifier; messages are built elsewhere.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
mail-auth = { version = "0.13.3", default-features = false, features = ["aws-lc-rs", "arc"] }
notify = "8"
notify-debouncer-mini = "0.7"
psl = "2.1"
quick_cache = "0.7"
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rpassword = "7"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
rusqlite = { version = "0.38", default-features = false, features = ["array", "backup", "bundled-sqlcipher", "cache", "functions"] }
rusqlite_migration = "2.4"
ruzstd = "0.9"
schemars = "1"
security-framework = { version = "3", features = ["OSX_10_15"] }
semver = { version = "1", features = ["serde"] }
# The original HTML engine (ADR-020): no JIT, no multiprocess, no devtools, no web APIs.
servo = { version = "0.7", default-features = false, features = ["baked-in-resources"] }
html5ever = "0.40.1"
linkify = "0.11.0"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
mail-builder = { version = "1.0", default-features = false }
# HTML quotes of replies become Markdown (PLAN §4.10).
htmd = "0.5.6"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
tantivy = { version = "0.27", default-features = false, features = ["stemmer", "lz4-compression", "columnar-zstd-compression"] }
tar = { version = "0.4", default-features = false }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = "1"
winnow = "1"
zeroize = { version = "1", features = ["derive"] }
whatlang = "0.18.0"
webpki-roots = "1"
zstd = { version = "0.14", default-features = false }

# Test-only
aead-stream = { version = "0.6", features = ["alloc"] }
image = { version = "0.25", default-features = false, features = ["png"] }
insta = { version = "1", features = ["json", "yaml"] }
pretty_assertions = "1"
proptest = "1"
rcgen = "0.14"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# GPUI and its hot dependencies run at full speed even in debug builds, as gpui-kit
# does: unoptimized layout, text shaping and rasterization make every frame slow.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
ropey = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

[profile.release]
# Fat LTO with one codegen unit keeps the stripped binary under the 40 MB budget
# (CONCEPT §3): ~35 MB instead of ~47 MB, at ~3.5 min extra build time.
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = true

[patch.crates-io]
# GPUI's font-kit fork wants freetype-sys 0.20 on Linux, Servo 0.7 wants 0.23, and
# only one crate may link `freetype`. The vendored copy differs from crates.io's
# zed-font-kit 0.14.1-zed only in that requirement (third_party/zed-font-kit/README.maze.md).
zed-font-kit = { path = "third_party/zed-font-kit" }
