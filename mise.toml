[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy,rust-src", profile = "minimal" }
"cargo:cargo-nextest" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-insta" = "latest"
# The website (Astro); pnpm matches `packageManager` in website/package.json.
node = "24"
pnpm = "12.15.0"

[tasks.start]
description = "Build and start Maze (dev build: fast incremental rebuilds)"
# script/dev-codesign gives the binary a stable signature if a "Maze Development"
# identity exists, so keychain "Always Allow" survives rebuilds (else it does nothing).
run = 'cargo build --locked -p mazemail && script/dev-codesign "${CARGO_TARGET_DIR:-target}/debug/mazemail" && exec "${CARGO_TARGET_DIR:-target}/debug/mazemail"'

[tasks.fmt]
description = "Format all crates"
run = "cargo fmt --all"

[tasks.lint]
description = "rustfmt check + clippy with warnings as errors"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks.test]
description = "Run the test suite"
run = "cargo nextest run --workspace --locked"

[tasks.deny]
description = "License and advisory checks"
run = "cargo deny check"

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "test", "deny"]

[tasks."website:install"]
description = "Install the website's dependencies (Astro, wrangler)"
dir = "website"
run = "pnpm install --frozen-lockfile"

[tasks."website:dev"]
description = "Run the website locally"
dir = "website"
depends = ["website:install"]
run = "pnpm run dev"

[tasks."website:check"]
description = "Build the website and check its links"
dir = "website"
depends = ["website:install"]
run = ["pnpm run check", "pnpm run build", "pnpm run check:links"]

[tasks."website:deploy"]
description = "Build and deploy mazemail.dev to Cloudflare (needs `mise run wrangler login`)"
dir = "website"
depends = ["website:install"]
run = "pnpm run deploy"

[tasks.wrangler]
description = "Cloudflare's wrangler, pinned by the website, e.g. `mise run wrangler login`"
dir = "website"
depends = ["website:install"]
run = "pnpm exec wrangler"

