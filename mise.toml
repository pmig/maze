[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy,rust-src", profile = "minimal" }
"cargo:cargo-nextest" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-insta" = "latest"
# Servo's build scripts (the original HTML engine, ADR-020) need Python 3.11 or newer.
python = "3.13"

[tasks.start]
description = "Build and start Maze (dev build with the original HTML engine: fast incremental rebuilds)"
# The Servo build (`original-html`) gets its own target directory: with the feature on,
# Cargo resolves features of shared dependencies differently, so building it in
# `target/` would make every switch between `mise start` and tests, clippy or
# rust-analyzer (which build without it) recompile GPUI and much of the tree.
# On macOS script/dev-bundle runs the binary from a minimal "Maze Dev.app" next to it,
# so notifications work, and signs it with the "Maze Development" identity if it exists
# (script/dev-codesign), so keychain "Always Allow" survives rebuilds. Elsewhere it
# starts the binary as it is.
env = { CARGO_TARGET_DIR = "{{config_root}}/target/servo" }
run = 'cargo build --locked -p mazemail --features original-html && exe=$(script/dev-bundle "$CARGO_TARGET_DIR/debug/mazemail") && exec "$exe"'

[tasks."start:lite"]
description = "Build and start Maze without the original HTML engine (fastest builds; shares target/ with tests)"
run = 'cargo build --locked -p mazemail && exe=$(script/dev-bundle target/debug/mazemail) && exec "$exe"'

[tasks.fmt]
description = "Format all crates"
run = "cargo fmt --all"

[tasks.lint]
description = "rustfmt check + clippy with warnings as errors"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks.test]
description = "Run the test suite"
run = "cargo nextest run --workspace --locked"

[tasks.deny]
description = "License and advisory checks"
run = "cargo deny check"

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "test", "deny"]
