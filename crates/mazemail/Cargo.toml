[package]
name = "mazemail"
description = "Maze, a local-first email client: the app and the mazemail CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library half holds what the app, headless mode, the examples and the tests share
# (the core-backed mail source, key store selection, startup); the binary is the entry
# point with the GUI, the CLI and `--headless`.
[lib]
name = "mazemail"
path = "src/lib.rs"

[[bin]]
name = "mazemail"
path = "src/main.rs"

[dependencies]
agent = { workspace = true }
agent_ui = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
auth = { workspace = true }
auto_update = { workspace = true }
auto_update_ui = { workspace = true }
clap = { workspace = true }
composer = { workspace = true }
gpui = { workspace = true }
local_api = { workspace = true }
mail_ui = { workspace = true }
mazemail_core = { workspace = true }
mazemail_types = { workspace = true }
release_channel = { workspace = true }
security = { workspace = true }
serde_json = { workspace = true }
settings = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ui = { workspace = true }
vault = { workspace = true }

[features]
default = []
# The original HTML engine (Servo, ADR-020). Release builds enable it
# (`script/bundle-mac`, CI's release job); dev builds and tests stay without it.
original-html = ["mail_ui/original-html"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# `render_to_image` for the screenshot example needs the platform's test support.
gpui_platform = { workspace = true, features = ["test-support"] }
image = { workspace = true }
imap = { workspace = true }
import = { workspace = true }
ingest = { workspace = true }
store = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
