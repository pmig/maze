[package]
name = "store"
description = "Maze local store: SQLCipher database, migrations, encrypted blob store and repositories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
mazemail_types = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
vault = { workspace = true }
zeroize = { workspace = true }
zstd = { workspace = true }

# SQLCipher's crypto backend (PLAN §4.17): on Apple targets `bundled-sqlcipher` uses
# CommonCrypto (no OpenSSL at all); everywhere else OpenSSL is vendored and linked
# statically so the build doesn't depend on the system libcrypto.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
