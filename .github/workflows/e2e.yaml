# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: E2E

# IMAP, SMTP, sync and the headless app against a real mail server (a pinned Stalwart
# release). It runs after CI, from the test binaries CI built and uploaded (a nextest
# archive), so nothing is compiled twice. It isn't a required check: a problem with
# the download or the server doesn't block a merge, and a failure shows up as a failed
# run. Locally: `mise run e2e`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: e2e-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# No secrets are used. The archive may come from a fork's pull request, so the job only
# gets read access.
permissions:
  contents: read
  actions: read

jobs:
  e2e:
    name: E2E (Linux x86_64, Stalwart)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The commit CI tested: the archive's paths point into this checkout, and the
      # tests read files next to them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # The app's shared libraries (the headless app is one of the tested binaries).
      - name: Install Linux system dependencies
        run: script/linux-deps

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tests
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest

      # The pinned Stalwart release (its version and checksums are in the script).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/stalwart
          key: stalwart-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/imap/tests/support/fetch-stalwart.sh') }}

      - name: Fetch Stalwart
        run: echo "MAZEMAIL_STALWART_BIN=$(sh crates/imap/tests/support/fetch-stalwart.sh target/stalwart)" >> "$GITHUB_ENV"

      - name: End-to-end tests
        env:
          MAZEMAIL_TEST_IMAP: "1"
        run: cargo nextest run --archive-file e2e-tests.tar.zst --workspace-remap . --run-ignored only
