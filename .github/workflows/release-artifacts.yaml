name: Release artifacts

# Started by release-please.yaml on the tag it creates (PLAN §4.16), or by pushing a
# tag by hand: builds, signs and notarizes the
# bundles, uploads them to the GitHub Release, and publishes the signed update
# manifests last, to the KV namespace the `releases` Worker serves on
# releases.mazemail.dev (releases/), so a client never sees a manifest that points at
# a missing file.
#
# macOS bundles are only signed and notarized when all Apple secrets are present
# (APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID, APPLE_NOTARY_KEY,
# APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER, APPLE_PROVISIONING_PROFILE). Without them
# the unsigned bundles are still uploaded, but no macOS update manifest is published,
# because the updater rejects bundles that aren't signed by our Team ID.
on:
  push:
    tags: ['*']
  # release-please.yaml runs `gh workflow run release-artifacts.yaml --ref refs/tags/<tag>`,
  # because its tags (created with the GITHUB_TOKEN) don't trigger the push event.
  workflow_dispatch:

concurrency:
  group: release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Where release_channel embeds the channel from (see crates/release_channel).
  RELEASE_CHANNEL_FILE: crates/mazemail/RELEASE_CHANNEL

jobs:
  prepare:
    name: Determine channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      sign: ${{ steps.sign.outputs.sign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches version.txt
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag '$TAG' does not match version.txt '$version'"
            exit 1
          fi

      - name: Determine release channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # release-please creates the tag and the release back to back, so wait a little.
          pre=""
          for _ in $(seq 1 24); do
            if pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease); then
              break
            fi
            pre=""
            sleep 5
          done
          case $pre in
            true) channel=preview ;;
            false) channel=stable ;;
            *) echo "::error::no GitHub Release found for tag $TAG"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Release $TAG is on the $channel channel"

      - name: Check Apple signing secrets
        id: sign
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          sign=true
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
            APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER APPLE_PROVISIONING_PROFILE; do
            if [ -z "${!var}" ]; then
              echo "::warning::secret $var is not set"
              sign=false
            fi
          done
          if [ "$sign" = false ]; then
            echo "::warning::macOS bundles will NOT be signed or notarized, and no macOS update manifest will be published"
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write # gh release upload
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos, arch: aarch64, target: aarch64-apple-darwin, runner: macos-latest }
          - { os: macos, arch: x86_64, target: x86_64-apple-darwin, runner: macos-latest }
          # Older Ubuntu images keep the tarball runnable on older glibc versions.
          - { os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { os: linux, arch: aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    env:
      TAG: ${{ github.ref_name }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      SIGN: ${{ needs.prepare.outputs.sign }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CFBundleVersion defaults to the commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: script/linux-deps

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Only the Rust toolchain: the test and lint tools aren't needed to build.
          install_args: rust

      - name: Add Rust target
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Write release channel
        run: printf '%s' "$CHANNEL" > "$RELEASE_CHANNEL_FILE"

      - name: Prepare provisioning profile
        if: matrix.os == 'macos' && env.SIGN == 'true'
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/maze.provisionprofile"

      - name: Bundle Maze.app
        if: matrix.os == 'macos'
        run: |
          args=(--target "$TARGET" --no-package)
          if [ "$SIGN" = true ]; then
            args+=(--provisioning-profile "$RUNNER_TEMP/maze.provisionprofile")
          fi
          script/bundle-mac "${args[@]}"

      - name: Sign and notarize Maze.app
        if: matrix.os == 'macos' && env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: script/sign-and-notarize-mac "dist/mac-$ARCH/Maze.app"

      - name: Pack .app.tar.zst and .dmg
        if: matrix.os == 'macos'
        run: script/package-mac "dist/mac-$ARCH/Maze.app" "$TAG" "$ARCH" dist

      - name: Bundle Linux tarball
        if: matrix.os == 'linux'
        run: script/bundle-linux --target "$TARGET"

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/Maze-*.tar.zst dist/Maze-*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no release artifacts found in dist/"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  publish-manifests:
    name: Publish update manifests
    needs: [prepare, build]
    # Manifests are only ever published from a release tag (never from a branch, even
    # with a manual run).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # gh release download
    # Its own environment (release tags only) with a token that can only read and write
    # the manifests in KV; CLOUDFLARE_ACCOUNT_ID is a repository secret
    # (docs/releasing.md).
    environment:
      name: manifests
      url: https://releases.mazemail.dev
    # One manifest publication at a time, across releases: the job reads the published
    # manifests, decides, and writes them back.
    concurrency:
      group: publish-update-manifests
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      SIGN: ${{ needs.prepare.outputs.sign }}
    steps:
      - name: Check signing key
        id: key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::secret UPDATE_SIGNING_KEY is not set, no update manifests are published"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.available == 'true'
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        if: steps.key.outputs.available == 'true'
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.key.outputs.available == 'true'
        with:
          key: xtask

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.key.outputs.available == 'true'
        with:
          package_json_file: releases/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.available == 'true'
        with:
          node-version-file: releases/.node-version
          cache: pnpm
          cache-dependency-path: releases/pnpm-lock.yaml

      # The pinned wrangler from releases/pnpm-lock.yaml; wrangler-action uses it too.
      - name: Install wrangler
        if: steps.key.outputs.available == 'true'
        working-directory: releases
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*.tar.zst'

      # generate-manifests compares against what is published, so a maintenance release
      # never downgrades a channel and preview never falls behind stable. Read from the
      # KV API, not from releases.mazemail.dev, which may still serve a cached copy.
      - name: Fetch the published manifests
        if: steps.key.outputs.available == 'true'
        working-directory: releases
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          mkdir -p ../manifests
          pnpm exec wrangler kv key list --binding MANIFESTS --remote > "$RUNNER_TEMP/keys.json"
          jq -r '.[].name' "$RUNNER_TEMP/keys.json" > "$RUNNER_TEMP/keys.txt"
          while IFS= read -r key; do
            # Only the keys the Worker serves; nothing else becomes a path here.
            if ! [[ $key =~ ^(stable|preview)/(macos|linux)-(aarch64|x86_64)\.json$ ]]; then
              echo "::warning::ignoring unexpected KV key '$key'"
              continue
            fi
            mkdir -p "../manifests/${key%/*}"
            pnpm exec wrangler kv key get --binding MANIFESTS --remote "$key" > "../manifests/$key"
            # A garbled copy would read as "nothing published" and could downgrade.
            if ! jq -e '.version | type == "string"' "../manifests/$key" > /dev/null; then
              echo "::error::the published $key is not a manifest"
              exit 1
            fi
            echo "fetched $key"
          done < "$RUNNER_TEMP/keys.txt"
          # What generate-manifests changes is compared against this copy.
          cp -R ../manifests "$RUNNER_TEMP/published"

      - name: Generate signed manifests
        if: steps.key.outputs.available == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/update-signing.key"
          (umask 077 && printf '%s' "$UPDATE_SIGNING_KEY" > "$key_file")
          export KEY_FILE="$key_file" ASSET_DIR=assets MANIFEST_DIR=manifests
          if [ "$SIGN" != true ]; then
            export SKIP_MACOS=1
          fi
          script/generate-manifests
          rm -f "$key_file"

      - name: Collect the changed manifests
        id: changed
        if: steps.key.outputs.available == 'true'
        shell: bash
        run: |
          bulk="$RUNNER_TEMP/manifests-bulk.json"
          entries=()
          cd manifests
          while IFS= read -r file; do
            key=${file#./}
            if cmp -s "$file" "$RUNNER_TEMP/published/$key"; then
              continue
            fi
            entries+=("$(jq -cn --arg key "$key" --rawfile value "$file" '{key: $key, value: $value}')")
            echo "publishing $key"
          done < <(find . -type f -name '*.json' | sort)
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${entries[@]}" | jq -s . > "$bulk"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Last, after every build has uploaded its assets to the GitHub Release, so a
      # client never sees a manifest that points at a missing file. One bulk write puts
      # all of this release's manifests at once.
      - name: Publish to the releases Worker (KV)
        if: steps.key.outputs.available == 'true' && steps.changed.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: "false"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: releases
          packageManager: pnpm
          command: kv bulk put --binding MANIFESTS --remote ${{ runner.temp }}/manifests-bulk.json
