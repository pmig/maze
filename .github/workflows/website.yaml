name: Website

# mazemail.dev (website/): an Astro static site served by Cloudflare Workers static
# assets. Pull requests that touch the site or the docs it renders get a type check,
# a build and a link check. main deploys. After every release the site is rebuilt,
# so the download buttons point at the new .dmg files.
on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "assets/icons/maze.svg"
      - ".github/workflows/website.yaml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "assets/icons/maze.svg"
      - ".github/workflows/website.yaml"
  # Release artifacts runs on tag pushes; workflow_run always runs on main.
  workflow_run:
    workflows: ["Release artifacts"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check (astro check)
        run: pnpm run check

      - name: Build
        run: pnpm run build
        env:
          # Read-only lookup of the latest release for the download links
          # (src/lib/release.ts); works while the repository is private.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check internal links
        run: pnpm run check:links

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website
      url: https://mazemail.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # Installs the pinned wrangler from the lockfile; wrangler-action uses it.
      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: "false"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          packageManager: pnpm
          command: deploy
