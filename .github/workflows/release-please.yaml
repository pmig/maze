name: Release Please

# Keeps the release PR (version.txt + CHANGELOG.md) up to date. Merging that PR
# creates the tag and the GitHub Release, and this workflow then starts
# release-artifacts.yaml on the tag. See PLAN §4.16.
#
# Runs with the built-in GITHUB_TOKEN, no bot token: a tag created with it starts no
# workflow by itself, so the release build is started explicitly below.
on:
  push:
    branches: [main, 'v*.*.x', 'v*.*.*-rc.x']
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # gh workflow run
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.ref_name }}
      # A tag created with the GITHUB_TOKEN starts no workflow, so the release build is
      # started on it here.
      - name: Start the release build
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release-artifacts.yaml --ref "refs/tags/$TAG"
