name: CI

# Pull requests and pushes to main: lint, test and a build of everything, the
# original HTML engine included (and, on Linux, the end-to-end test binaries for the
# E2E workflow). Licenses and advisories are checked in cargo-deny.yaml, on dependency
# changes and on a schedule. Nothing is built for distribution or published from here
# (PLAN §4.16): app bundles come from release tags only (release-artifacts.yaml).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
          - name: Linux x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: script/linux-deps

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # Only `main` saves: pull requests restore its cache, but a cache saved by a pull
      # request serves only that pull request and would crowd `main`'s out of the
      # repository's 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint (rustfmt + clippy)
        run: mise run lint

      - name: Test
        run: mise run test
        env:
          # .config/nextest.toml: fewer tests at once, retries for flaky ones.
          NEXTEST_PROFILE: ci

      - name: Build
        run: cargo build --locked

      # The end-to-end tests run in the E2E workflow once this run is done, from these
      # binaries: packing them reuses what the test step built.
      - name: Archive the end-to-end tests
        if: runner.os == 'Linux'
        run: >-
          cargo nextest archive --workspace --locked --archive-file e2e-tests.tar.zst
          -E 'binary(stalwart) | binary(imap_e2e) | binary(send_e2e)'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: e2e-tests
          path: e2e-tests.tar.zst
          retention-days: 3
          if-no-files-found: error

  prune-cache:
    name: Prune older caches
    # Only `main` saves the check cache; after a dependency change the cache of the
    # previous Cargo.lock still takes up its share of the repository's 10 GB, which
    # holds two of these per OS at most.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # rust-cache keys end in two hashes (environment, Cargo.lock): group by the rest
      # (the OS and architecture) and delete all but the newest of each group. An OS
      # whose run failed saved nothing new, so its last cache stays.
      - name: Keep the newest cache per OS
        run: |
          gh cache list --key 'v0-rust-check-' --ref refs/heads/main --limit 100 \
            --json id,key,createdAt \
            --jq 'group_by(.key | split("-") | .[:-2] | join("-")) | .[]
                  | sort_by(.createdAt) | reverse | .[1:][] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "deleting $key"
              gh cache delete "$id"
            done
