# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release cache

# Release builds (release-artifacts.yaml, on a tag) compile the release profile (fat LTO)
# for four targets, and a tag's run can only restore caches saved on `main`. This builds
# the same thing on `main`, so a release starts from compiled dependencies. Nothing is
# bundled, signed or uploaded: there are no builds between releases (ADR-011).
#
# rust-cache keeps the dependencies, not the workspace crates, so this only needs to run
# when they, the toolchain or the profiles change, and twice a week so GitHub doesn't
# evict the caches (it drops caches unused for 7 days). The key (`shared-key`) and the
# environment must match release-artifacts.yaml's build job for its run to hit.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - 'script/linux-deps'
      - '.github/workflows/release-cache.yaml'
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions:
  contents: read

# As in release-artifacts.yaml: rust-cache's key hashes the `CARGO_*` variables.
env:
  CARGO_TERM_COLOR: always
  RELEASE_CHANNEL_FILE: crates/mazemail/RELEASE_CHANNEL

jobs:
  build:
    name: Release cache (${{ matrix.os }} ${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, arch: aarch64, target: aarch64-apple-darwin, runner: macos-latest }
          - { os: macos, arch: x86_64, target: x86_64-apple-darwin, runner: macos-latest }
          - { os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { os: linux, arch: aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: script/linux-deps

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: rust

      - name: Add Rust target
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build the release binary
        run: cargo build --release --locked --target "$TARGET" --package mazemail

  prune-cache:
    name: Prune older caches
    # Keeps one release cache per target, as ci.yaml does for the check caches.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # rust-cache keys end in two hashes (environment, Cargo.lock): group by the rest
      # (the target, OS and architecture) and delete all but the newest of each group.
      # A target whose run failed saved nothing new, so its last cache stays.
      - name: Keep the newest cache per target
        run: |
          gh cache list --key 'v0-rust-release-' --ref refs/heads/main --limit 100 \
            --json id,key,createdAt \
            --jq 'group_by(.key | split("-") | .[:-2] | join("-")) | .[]
                  | sort_by(.createdAt) | reverse | .[1:][] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "deleting $key"
              gh cache delete "$id"
            done
