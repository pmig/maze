# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Cargo Deny

# Licenses, bans, sources and advisories (deny.toml), kept out of CI so that a new
# advisory doesn't fail every pull request and push. It runs on pull requests that
# change dependencies and twice a day on main, where a new advisory shows up as a
# failed run.
on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/cargo-deny.yaml'
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

concurrency:
  group: cargo-deny-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: Cargo Deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check ${{ matrix.checks }}
