name: Releases Worker

# releases.mazemail.dev (releases/): the `releases` Worker that serves the signed
# update manifests from Workers KV. Pull requests that touch it run the tests and a
# dry-run deploy (bundles the Worker and validates wrangler.jsonc). main deploys. The
# manifests themselves are written by release-artifacts.yaml, not here; a deploy
# doesn't touch them.
on:
  pull_request:
    paths:
      - "releases/**"
      - ".github/workflows/release-worker.yaml"
  push:
    branches: [main]
    paths:
      - "releases/**"
      - ".github/workflows/release-worker.yaml"
  workflow_dispatch:

concurrency:
  group: release-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: releases

jobs:
  check:
    name: Test and dry-run deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: releases/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: releases/.node-version
          cache: pnpm
          cache-dependency-path: releases/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Dry-run deploy
        run: pnpm exec wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: "false"

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own environment (main only) with a token that can deploy the Worker but not
    # write manifests; CLOUDFLARE_ACCOUNT_ID is a repository secret (docs/releasing.md).
    environment:
      name: releases
      url: https://releases.mazemail.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: releases/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: releases/.node-version
          cache: pnpm
          cache-dependency-path: releases/pnpm-lock.yaml

      # Installs the pinned wrangler from the lockfile; wrangler-action uses it.
      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: "false"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: releases
          packageManager: pnpm
          command: deploy
