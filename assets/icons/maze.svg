<?xml version="1.0" encoding="UTF-8"?>
<!-- The Maze app icon: an envelope whose flap is a maze, with the goal in its centre.
     1024x1024 canvas with the macOS icon grid (824 px body, 100 px margin).
     Rendered by script/render-icons to Maze.icns (macOS) and maze.png (Linux). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52555F"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)" filter="url(#shadow)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <rect x="204" y="304" width="616" height="416" rx="60"/>
    <path d="M276 376 H356 V456 H436 V536 H588 V456 H668 V376 H748"/>
    <path d="M276 476 V636 H448"/>
    <path d="M576 636 H748 V476"/>
  </g>
  <circle cx="512" cy="436" r="34" fill="#FFB86B"/>
</svg>
