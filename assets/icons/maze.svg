<?xml version="1.0" encoding="UTF-8"?>
<!-- The Maze app icon: on an amber tile, an envelope whose flap folds down in two soft
     terraces, like steps into a maze, with the goal in the fold showing the amber through.
     Every layer is one exact closed path (circular arcs, nothing clipped); the generator
     and its geometry checks live in website/scripts/logo-options/generate.mjs (option 50,
     scaled 1.125 about the centre).
     1024x1024 canvas with the macOS icon grid (824 px body, 100 px margin).
     Rendered by script/render-icons to Maze.icns (macOS) and maze.png (Linux). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC888"/>
      <stop offset="1" stop-color="#F5A04A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)" filter="url(#shadow)"/>
