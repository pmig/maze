# Test runner settings (cargo-nextest). Locally the default profile applies; CI runs
# `mise run test` with NEXTEST_PROFILE=ci.

[profile.ci]
# GitHub's runners have few cores and slow disks: fewer tests at once leave the
# timing-dependent ones (sync engines, IMAP fakes, background tasks) room to finish.
test-threads = 2
# A test that passes on a retry is reported as flaky (in the log) but doesn't fail the
# run; one that fails every time still does.
retries = 2
# Report every failure of a run, not just the first.
fail-fast = false
# Flag tests that hang instead of waiting for the job's timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
