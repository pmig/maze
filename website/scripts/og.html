<!doctype html>
<!--
  The social card (public/og.png, 1200x630). Not part of the build: regenerate it
  after changing this file, from the website/ directory, with any Chromium:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --window-size=1200,630 --force-device-scale-factor=1 \
      --screenshot="$PWD/public/og.png" "file://$PWD/scripts/og.html"

-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maze social card</title>
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 100 700;
        src: url("../node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Lilex";
        font-weight: 100 700;
        src: url("../node_modules/@fontsource-variable/lilex/files/lilex-latin-wght-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0b0b0d;
        color: #e5e5e8;
        font-family: "IBM Plex Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        position: absolute;
        inset: 0 56px;
        border-inline: 1px solid #242428;
        background:
          radial-gradient(70% 90% at 85% 110%, rgb(161 161 170 / 0.16), transparent 70%),
          #0f0f12;
      }
      .text {
        position: absolute;
        left: 104px;
        top: 84px;
        width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f7f7f8;
      }
      .badge {
        margin-left: 6px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 3px 12px;
        border: 1px solid #34343a;
        border-radius: 999px;
        font-family: "Lilex", monospace;
        font-size: 15px;
        font-weight: 400;
        color: #a4a4ac;
      }
      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffb86b;
      }
      h1 {
        margin: 48px 0 0;
        font-size: 58px;
        line-height: 1.06;
        letter-spacing: -0.03em;
        font-weight: 600;
        color: #f7f7f8;
      }
      h1 span {
        display: block;
        color: #a4a4ac;
        font-weight: 500;
      }
      p {
        margin: 28px 0 0;
        font-size: 21px;
        line-height: 1.5;
        color: #a4a4ac;
      }
      .url {
        position: absolute;
        left: 104px;
        bottom: 56px;
        font-family: "Lilex", monospace;
        font-size: 18px;
        color: #d4d4d8;
      }
      .shot {
        position: absolute;
        left: 660px;
        top: 96px;
        width: 860px;
        border: 1px solid #34343a;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.8);
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="text">
      <div class="brand">
        <svg width="48" height="48" viewBox="100 100 824 824" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FFC888" />
              <stop offset="1" stop-color="#F5A04A" />
            </linearGradient>
          </defs>
          <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" />
          <rect x="165.5" y="278" width="693" height="468" rx="81" fill="#2E3037" />
          <path d="M165.5 476 L197 476 A40.5 40.5 0 0 1 237.5 516.5 A40.5 40.5 0 0 0 278 557 L291.5 557 A40.5 40.5 0 0 1 332 597.5 A40.5 40.5 0 0 0 372.5 638 L651.5 638 A40.5 40.5 0 0 0 692 597.5 A40.5 40.5 0 0 1 732.5 557 L746 557 A40.5 40.5 0 0 0 786.5 516.5 A40.5 40.5 0 0 1 827 476 L858.5 476 L858.5 359 A81 81 0 0 0 777.5 278 L246.5 278 A81 81 0 0 0 165.5 359 Z" fill="#A1A1AA" />
          <path d="M165.5 368 L305 368 A40.5 40.5 0 0 1 345.5 408.5 A40.5 40.5 0 0 0 386 449 L399.5 449 A40.5 40.5 0 0 1 440 489.5 A40.5 40.5 0 0 0 480.5 530 L543.5 530 A40.5 40.5 0 0 0 584 489.5 A40.5 40.5 0 0 1 624.5 449 L638 449 A40.5 40.5 0 0 0 678.5 408.5 A40.5 40.5 0 0 1 719 368 L858.5 368 L858.5 359 A81 81 0 0 0 777.5 278 L246.5 278 A81 81 0 0 0 165.5 359 Z" fill="#F4F4F5" />
          <circle cx="512" cy="584" r="40.5" fill="#FFB86B" />
        </svg>
        Maze
        <span class="badge">open source</span>
      </div>
      <h1>The agentic email client.<span>Crafted for speed.</span></h1>
      <p>A local-first email client in Rust, made for collaboration with humans and AI. Encrypted at rest.</p>
    </div>
    <div class="url">mazemail.dev</div>
    <div class="shot"><img src="../../docs/screenshots/app-table-dark.png" alt="" /></div>
  </body>
</html>
