# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates that only reach us through GPUI and gpui-kit (`gpui-pre-*`,
# pinned by gpui-kit, PLAN ADR-002). We can't replace them without forking GPUI;
# re-check when gpui-kit moves to a newer GPUI snapshot.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant: via GPUI, unmaintained only" },
  { id = "RUSTSEC-2024-0436", reason = "paste: via GPUI, unmaintained only" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: via GPUI's HTTP client, unmaintained only" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: GPUI text shaping, unmaintained only" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: GPUI text shaping, unmaintained only" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: GPUI Linux (zbus), unmaintained only" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: GPUI Linux (zbus), unmaintained only" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: GPUI Linux (zbus), unmaintained only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Everything here is compatible with GPL-3.0-or-later (ADR-001).
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
